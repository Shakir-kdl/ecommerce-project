server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Shakir-kdl/springboot-microservices.git
          default-label: main
          clone-on-start: true
          force-pull: true
          search-paths: configs/18thaug

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.config: DEBUG